<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Jati Jaya</title>
    <link rel="stylesheet" href="JatiJaya.css">
</head>
<body>
    <!-- HEADER & INFO TOKO -->
    <header>
        <h1>TOKO PERABOTAN JATI JAYA</h1>
        <p class="address">Tanah Abang Market, Sebrang Blok G, Lantai 1</p>
        <p class="hours">⏰ Buka: 09.00 - 17.30 (Diskon Khusus Pelanggan Tetap)</p>
        <div class="tagline">Melayani: Perlengkapan Dapur, Elektronik, Alat Kebersihan, Bayi, ATK, Terpal & Jasa Servis</div>
    </header>

    <!-- SEARCH & KATEGORI -->
    <div class="search-filter">
        <input type="text" id="searchInput" placeholder="Cari barang...">
        <div id="categoryFilters" class="filter-buttons"></div>
    </div>

    <!-- KATALOG PRODUK (GRID) -->
    <h2 style="margin: 20px 15px;">Katalog Produk</h2>
    <div id="productGrid" class="product-grid"></div>

    <!-- MODAL DETAIL PRODUK -->
    <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modalImage" src="" alt="Produk">
            <h3 id="modalTitle"></h3>
            <p id="modalPrice" class="price-large"></p>
            <div id="relatedProducts" class="related-grid"></div>
        </div>
    </div>

    <!-- FOOTER & WHATSAPP -->
    <footer>
        <a href="https://wa.me/6281212664277" class="wa-float" target="_blank">💬 Chat WA</a>
        <p>Call Center: +62 81212 6642 77</p>
    </footer>

    <script src="JatiJaya.js"></script>
</body>
</html>
